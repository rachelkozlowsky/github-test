name: Deploy and Versioning

on:
  push:
    branches:
      - develop
      - 'release-*'
      - homol
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy manually'
        required: true
        default: 'develop'
        type: choice
        options:
        - develop
        - homol
        - production

jobs:
  versioning:
    runs-on: ubuntu-latest
    # Executa versionamento apenas na branch main
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true

  deploy:
    runs-on: ubuntu-latest
    needs: [versioning]
    if: always() && (needs.versioning.result == 'success' || needs.versioning.result == 'skipped')
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Placeholder
        run: |
          echo "Iniciando deploy simulado..."
          echo "Branch/Ref: ${{ github.ref_name }}"
          echo "Ambiente: ${{ inputs.environment || 'Automático' }}"
          echo "Como não há ambientes configurados (ENV), este passo apenas registra a execução."
