name: Auto PR Homol to Production

on:
  push:
    branches:
      - homol

jobs:
  create-pr-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head homol \
            --title "Release: Homol to Main" \
            --body "Automated PR for Production release." \
            || echo "PR creation failed or PR already exists."
