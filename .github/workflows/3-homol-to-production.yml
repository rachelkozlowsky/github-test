name: Auto PR Homol to Production

on:
  push:
    branches:
      - homol

jobs:
  create-pr-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Release to Production
          title: 'Release: Homol to Main'
          body: 'Automated PR for Production release.'
          branch: homol
          base: main
