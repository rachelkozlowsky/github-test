name: Auto PR Feature to Develop

on:
  push:
    branches:
      - 'feature/*'

jobs:
  create-pr-develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Auto PR from feature branch
          title: 'Merge Feature: ${{ github.ref_name }} into Develop'
          body: 'Automated PR created by GitHub Actions.'
          branch: ${{ github.ref_name }}
          base: develop
          delete-branch: true
